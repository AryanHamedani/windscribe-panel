name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Manifest
        run: |
          jq -e '.schemaVersion == 1 and (.id | test("^[A-Za-z0-9][A-Za-z0-9._-]*$")) and (.entryPoints.barWidget | test("^[^/].*\\.qml$"))' manifest.json
          test -f "$(jq -r .entryPoints.barWidget manifest.json)"
      - name: Shell scripts
        run: shellcheck bin/setup
