name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Shell scripts
        run: shellcheck install.sh bin/setup
      - name: Waybar module is valid JSON once comments are stripped
        run: sed 's#^\s*//.*##' waybar/module.jsonc | jq -e '."custom/windscribe".exec'
      - name: Omarchy manifest points at a file that exists
        run: test -f "$(jq -r .entryPoints.barWidget manifest.json)"
